name: Conformance vectors

on:
  push:
    paths:
      - 'schema/**'
      - 'impl/**'
      - 'tools/poc-vectors/**'
      - '.github/workflows/poc-vectors-conformance.yml'
  pull_request:
    paths:
      - 'schema/**'
      - 'impl/**'
      - 'tools/poc-vectors/**'
      - '.github/workflows/poc-vectors-conformance.yml'

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned vector set
        run: python3 -m pip install -r tools/poc-vectors/requirements.txt
      - name: Verify the published vectors with the reference validator
        run: python3 schema/validate.py --vectors
      - name: Verify the pinned corpus with the twin verifier it ships
        run: python3 -m poc_evidence_vectors.run_vectors
